<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title">
<title id="title">PullStar — Align the night. Keep the motion. A local macOS app for aligned night-sky images, star trails, and MCP automation.</title>
<style>
@keyframes trace {from {stroke-dashoffset:900} to {stroke-dashoffset:0}}
@keyframes rise {from {transform:scaleY(.15)} to {transform:scaleY(1)}}
@keyframes pulse {0%,100% {opacity:1} 45% {opacity:.3}}
@keyframes sweep {0% {transform:translateX(-17px);opacity:0} 25%,75% {opacity:1} 100% {transform:translateX(17px);opacity:0}}
@keyframes focus {0%,100% {opacity:.2} 50% {opacity:.9}}
@keyframes drift {0%,100% {transform:translateY(0)} 50% {transform:translateY(-8px)}}
.trace {stroke-dasharray:900;animation:trace 3.8s cubic-bezier(.16,1,.3,1) both}
.bar {transform-box:fill-box;transform-origin:center bottom;animation:rise 1.4s cubic-bezier(.16,1,.3,1) both}
.pulse {animation:pulse 2.2s ease-in-out 2}
.signal {animation:sweep 3.8s ease-in-out both}
.heat {animation:focus 3.8s ease-in-out}
.float {animation:drift 4.2s ease-in-out}
@media (prefers-reduced-motion:reduce) {* {animation:none!important}}
</style>
<rect width="1200" height="320" rx="18" fill="#102d2b"/>
<text x="48" y="42" fill="#e3ac87" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2.5">RELEASED / MACOS APP</text><text x="48" y="108" fill="#f6f0e5" font-family="Georgia, Times New Roman, serif" font-size="61" >PullStar</text><text x="50" y="160" fill="#e3ac87" font-family="Georgia, Times New Roman, serif" font-size="30" font-style="italic">Align the night. Keep the motion.</text><text x="50" y="211" fill="#a9bbb1" font-family="Arial, Helvetica, sans-serif" font-size="18" >Camera wobble corrected. Star trails preserved.</text><path d="M48,250 L1152,250" fill="none" stroke="#b8d7bc" opacity="0.2"/><text x="50" y="285" fill="#a9bbb1" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">LOCAL PROCESSING / ALIGNED FRAMES / MCP</text><text x="1150" y="285" fill="#e3ac87" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" letter-spacing="1.5">EXPLORE THE RELEASE ↗</text><path class="trace" style="animation-delay:0.0s" d="M946.56,240.42 L947.60,238.27 L948.72,236.16 L949.91,234.09 L951.17,232.07 L952.50,230.08 L953.89,228.15 L955.35,226.26 L956.87,224.42 L958.46,222.64 L960.10,220.91 L961.80,219.24 L963.56,217.62 L965.37,216.07 L967.24,214.58 L969.15,213.16 L971.11,211.80 L973.12,210.51 L975.17,209.28 L977.26,208.13 L979.38,207.05 L981.55,206.04 L983.74,205.11 L985.97,204.25 L988.22,203.47 L990.50,202.77 L992.81,202.14 L995.13,201.60 L997.47,201.13 L999.82,200.74 L1002.19,200.44 L1004.56,200.21 L1006.95,200.07 L1009.33,200.00 L1011.72,200.02 L1014.10,200.12 L1016.48,200.30 L1018.85,200.56 L1021.21,200.90 L1023.56,201.33 L1025.90,201.83 L1028.21,202.41 L1030.50,203.07 L1032.77,203.81 L1035.01,204.62 L1037.23,205.51 L1039.41,206.48 L1041.56,207.52 L1043.67,208.63 L1045.74,209.81 L1047.77,211.07 L1049.76,212.39 L1051.70,213.78 L1053.59,215.23 L1055.43,216.75 L1057.22,218.33 L1058.95,219.97 L1060.63,221.66 L1062.25,223.42 L1063.81,225.22 L1065.30,227.08 L1066.73,228.99 L1068.10,230.95 L1069.39,232.9