<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title">
<title id="title">Manya Kaistha — Curiosity, made tangible. AI systems, thoughtful interfaces, open experiments.</title>
<rect width="1200" height="350" rx="18" fill="#102d2b"/>
<text x="50" y="49" fill="#e3ac87" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3">MANYA KAISTHA</text><text x="50" y="122" fill="#f6f0e5" font-family="Georgia, Times New Roman, serif" font-size="65" >Curiosity,</text><text x="50" y="192" fill="#e3ac87" font-family="Georgia, Times New Roman, serif" font-size="65" font-style="italic">made tangible.</text><text x="53" y="241" fill="#a9bbb1" font-family="Arial, Helvetica, sans-serif" font-size="18" >AI systems. Thoughtful interfaces. Open experiments.</text><path d="M52,279 L1148,279" fill="none" stroke="#b8d7bc" opacity="0.2"/><text x="53" y="313" fill="#a9bbb1" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">BUILD  /  INVESTIGATE  /  EXPLAIN</text><text x="1148" y="313" fill="#e3ac87" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" letter-spacing="1.5">A WORK IN PROGRESS, BY DESIGN.</text><g transform="translate(967 151)"><ellipse rx="139" ry="49" transform="rotate(-35)" fill="none" stroke="#b8d7bc" opacity=".32"/><ellipse rx="139" ry="49" transform="rotate(35)" fill="none" stroke="#b8d7bc" opacity=".32"/><ellipse rx="139" ry="49" transform="rotate(90)" fill="none" stroke="#b8d7bc" opacity=".32"/><circle cx="0" cy="0" r="33" stroke="#e3ac87" fill="#102d2b" opacity="1"/><circle cx="0" cy="0" r="8" stroke="#e3ac87" fill="#e3ac87" opacity="1"/><circle cx="124.0" cy="0.0" r="7" stroke="#e3ac87" fill="#102d2b" opacity="1"/><circle cx="124.0" cy="0.0" r="2" stroke="#e3ac87" fill="#e3ac87" opacity="1"/><circle cx="-72.97" cy="80.85" r="7" stroke="#e3ac87" fill="#102d2b" opacity="1"/><circle cx="-72.97" cy="80.85" r="2" stroke="#e3ac87" fill="#e3ac87" opacity="1"/><circle cx="-55.31" cy="-89.5" r="7" stroke="#e3ac87" fill="#102d2b" opacity="1"/><circle cx="-55.31" cy="-89.5" r="2" stroke="#e3ac87" fill="#e3ac87" opacity="1"/></g></svg>